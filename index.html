<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Go →</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222}header{background:#062b63;color:#fff;padding:18px;text-align:center;font-size:28px;font-weight:bold}.container{max-width:600px;margin:auto;padding:18px}h2{color:#062b63}label{display:block;margin:14px 0 5px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:7px;font-size:16px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:7px;background:#062b63;color:#fff;font-size:17px;font-weight:bold}.secondary{background:#fff;color:#062b63;border:2px solid #062b63}.hidden{display:none}.sugestao{border:1px solid #ccc;border-radius:7px;padding:12px;margin:8px 0;cursor:pointer}.sugestao strong{display:block;color:#062b63;margin-bottom:5px}.campo{display:flex;gap:8px}.campo input{flex:1}.editar{width:52px;margin-top:0}.info{margin-top:15px;padding:15px;border-radius:8px;background:#f1f5fa;border:1px solid #d5dce5}.info div{margin:7px 0}#mapa{width:100%;height:calc(100vh - 370px);min-height:280px;margin-top:15px;border-radius:8px}@media(max-width:600px){.container{padding:14px}#mapa{height:calc(100vh - 330px);min-height:260px}}</style>
</head><body><header>Go →</header><div class="container">
<section id="cadastro"><h2>Cadastro do passageiro</h2><label>Nome</label><input id="nome"><label>Endereço</label><input id="endereco"><label>E-mail</label><input id="email" type="email"><label>Telefone</label><input id="telefone"><button onclick="salvarCadastro()">Salvar cadastro</button><div id="msgCadastro"></div></section>
<section id="login" class="hidden"><h2>Login</h2><label>Usuário</label><input id="usuario"><label>Senha</label><input id="senha" type="password"><button onclick="login()">Login</button><button class="secondary" onclick="tela('cadastroLogin')">Cadastrar usuário e senha</button><div id="msgLogin"></div></section>
<section id="cadastroLogin" class="hidden"><h2>Cadastrar usuário e senha</h2><label>Usuário</label><input id="novoUsuario"><label>Senha</label><input id="novaSenha" type="password"><button onclick="salvarLogin()">Salvar usuário e senha</button><button class="secondary" onclick="tela('login')">Voltar para login</button><div id="msgCadastroLogin"></div></section>
<section id="corrida" class="hidden"><h2>Solicitar corrida</h2><label>Embarque</label><div class="campo"><input id="embarque" placeholder="Obtendo localização..." readonly><button class="editar" onclick="editarEmbarque()">✎</button></div><label>Desembarque</label><div class="campo"><input id="desembarque" placeholder="Digite o endereço de destino" autocomplete="off"><button class="editar" onclick="document.getElementById('desembarque').focus()">✎</button></div><div id="sugestoes"></div><button onclick="calcularRota()">Calcular rota</button><div id="resultado"></div><div id="mapa"></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const C='go_cadastro_passageiro',L='go_login_passageiro';let olat=null,olon=null,dlat=null,dlon=null,map=null,line=null,mo=null,md=null,timer;
function tela(id){['cadastro','login','cadastroLogin','corrida'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function salvarCadastro(){let v=['nome','endereco','email','telefone'].map(x=>document.getElementById(x).value.trim());if(v.some(x=>!x)){msgCadastro.textContent='Preencha todos os campos.';return}localStorage.setItem(C,JSON.stringify({nome:v[0],endereco:v[1],email:v[2],telefone:v[3]}));['nome','endereco','email','telefone'].forEach(x=>document.getElementById(x).value='');msgCadastro.textContent='Cadastro salvo com sucesso.';setTimeout(()=>tela('login'),700)}
function salvarLogin(){let u=novoUsuario.value.trim(),s=novaSenha.value;if(!u||!s){msgCadastroLogin.textContent='Digite o usuário e a senha.';return}localStorage.setItem(L,JSON.stringify({usuario:u,senha:s}));novoUsuario.value='';novaSenha.value='';msgCadastroLogin.textContent='Usuário e senha salvos.';setTimeout(()=>tela('login'),700)}
function login(){let x=localStorage.getItem(L);if(!x){msgLogin.textContent='Cadastre primeiro um usuário e uma senha.';return}let a=JSON.parse(x);if(usuario.value.trim()===a.usuario&&senha.value===a.senha){tela('corrida');iniciarGPS()}else msgLogin.textContent='Usuário ou senha incorretos.'}
function iniciarGPS(){embarque.value='Obtendo localização...';if(!navigator.geolocation){embarque.value='GPS não disponível.';return}navigator.geolocation.getCurrentPosition(async p=>{olat=p.coords.latitude;olon=p.coords.longitude;try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${olat}&lon=${olon}&zoom=18&addressdetails=1&accept-language=pt-BR`);let d=await r.json();embarque.value=d.display_name||`${olat}, ${olon}`}catch(e){embarque.value=`${olat.toFixed(6)}, ${olon.toFixed(6)}`}},()=>embarque.value='Não foi possível obter sua localização.',{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function editarEmbarque(){embarque.readOnly=!embarque.readOnly;if(!embarque.readOnly)embarque.focus()}
desembarque.addEventListener('input',()=>{clearTimeout(timer);dlat=dlon=null;let q=desembarque.value.trim();if(q.length<3){sugestoes.innerHTML='';return}timer=setTimeout(()=>buscar(q),600)})
async function buscar(q){sugestoes.textContent='Pesquisando endereços...';try{let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=br&limit=10&addressdetails=1&dedupe=0&accept-language=pt-BR`),a=await r.json();sugestoes.innerHTML='';if(!a.length){sugestoes.textContent='Nenhum endereço encontrado.';return}a.forEach(i=>{let d=i.address||{},rua=d.road||d.pedestrian||d.footway||i.display_name,b=d.suburb||d.neighbourhood||d.quarter||'',c=d.city||d.town||d.municipality||'',e=d.state||'',n=d.house_number?', nº '+d.house_number:'';let el=document.createElement('div');el.className='sugestao';el.innerHTML=`<strong>${esc(rua)}${esc(n)}</strong>${esc(b)}${b&&c?' - ':''}${esc(c)}${c&&e?' - ':''}${esc(e)}`;el.onclick=()=>{dlat=+i.lat;dlon=+i.lon;desembarque.value=i.display_name;sugestoes.innerHTML=''};sugestoes.appendChild(el)})}catch(e){sugestoes.textContent='Não foi possível pesquisar o endereço.'}}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function calcularRota(){if(olat===null){resultado.innerHTML='<div class="info">Obtendo localização de embarque...</div>';iniciarGPS();return}if(dlat===null){resultado.innerHTML='<div class="info">Selecione um endereço de desembarque na lista.</div>';return}resultado.innerHTML='<div class="info">Calculando rota...</div>';try{let r=await fetch(`https://router.project-osrm.org/route/v1/driving/${olon},${olat};${dlon},${dlat}?overview=full&geometries=geojson`),j=await r.json(),rt=j.routes[0],km=rt.distance/1000,min=Math.ceil(rt.duration/60),preco=Math.max(7,km*2+min);resultado.innerHTML=`<div class="info"><div><b>Distância:</b> ${km.toFixed(2)} km</div><div><b>Tempo estimado:</b> ${min} min</div><div><b>Valor da corrida:</b> R$ ${preco.toFixed(2).replace('.',',')}</div></div>`;mostrarMapa(rt.geometry)}catch(e){resultado.innerHTML='<div class="info">Não foi possível calcular a rota.</div>'}}
function mostrarMapa(g){if(!map){map=L.map('mapa');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map)}if(mo)map.removeLayer(mo);if(md)map.removeLayer(md);if(line)map.removeLayer(line);mo=L.marker([olat,olon]).addTo(map).bindPopup('Embarque');md=L.marker([dlat,dlon]).addTo(map).bindPopup('Desembarque');line=L.geoJSON(g).addTo(map);map.fitBounds(L.featureGroup([mo,md,line]).getBounds(),{padding:[30,30]});setTimeout(()=>map.invalidateSize(),300)}
if(localStorage.getItem(C))tela('login');else tela('cadastro');
</script></body></html>
